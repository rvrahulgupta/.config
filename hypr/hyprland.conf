
$mainMod = SUPER
$terminal = kgx
$fileManager = nautilus
$menu = qs -c noctalia-shell ipc call launcher toggle
$browser = librewolf

monitor = eDP-1, 1920x1080@60, 0x0, 1.5
monitor = HDMI-A-1, disable

exec = sleep 1 && ~/.config/hypr/scripts/monitor-switch.sh $(cat /sys/class/drm/card1-HDMI-A-1/status)

#####################
### LOOK AND FEEL ###
#####################
# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    # col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    # col.inactive_border = rgba(595959aa)
    # col.active_border = rgb(FFD25A)
    col.active_border = rgb(ffffff)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 14
    rounding_power = 8
    
    # Change transparency of focused and unfocused windows
    active_opacity = 1
    inactive_opacity = 1

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = false
        size = 5
        passes = 1

        vibrancy = 0.1696
    }
}

source = ~/.config/hypr/noctalia/noctalia-colors.conf

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
  # enabled = yes, please :)
  enabled = false

  # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
  #        NAME,           X0,   Y0,   X1,   Y1
  bezier = easeOutQuint,   0.23, 1,    0.32, 1
  bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
  bezier = linear,         0,    0,    1,    1
  bezier = almostLinear,   0.5,  0.5,  0.75, 1
  bezier = quick,          0.15, 0,    0.1,  1

  # Default animations, see https://wiki.hypr.land/Configuring/Animations/
  #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
  # animation = global,        1,     10,    default
  # animation = border,        1,     5.39,  easeOutQuint
  # animation = windows,       1,     4.79,  easeOutQuint
  # animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
  # animation = windowsOut,    1,     1.49,  linear,       popin 87%
  # animation = fadeIn,        1,     1.73,  almostLinear
  # animation = fadeOut,       1,     1.46,  almostLinear
  # animation = fade,          1,     3.03,  quick
  # animation = layers,        1,     3.81,  easeOutQuint
  # animation = layersIn,      1,     4,     easeOutQuint, fade
  # animation = layersOut,     1,     1.5,   linear,       fade
  # animation = fadeLayersIn,  1,     1.79,  almostLinear
  # animation = fadeLayersOut, 1,     1.39,  almostLinear
  # animation = workspaces,    1,     1.94,  almostLinear, fade
  # animation = workspacesIn,  1,     1.21,  almostLinear, fade
  # animation = workspacesOut, 1,     1.94,  almostLinear, fade
  animation = zoomFactor,    1,     7,     quick
}

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true
}

debug {
	vfr = true
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    disable_splash_rendering = true
    initial_workspace_tracking = 1
}

xwayland {
    force_zero_scaling = false
}

windowrule = match:class ^(DesktopEditors)$, match:title ^(Save As)$, center on, size 600 460
windowrule = match:xwayland true, match:float true, match:title negative:^(DesktopEditors)$, center on
windowrule = size 600 460, match:class ^(xdg-desktop-portal-gtk)$
windowrule = center on, match:class ^(xdg-desktop-portal-gtk)$

env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORMTHEME,qt5ct
env = GTK_USE_PORTAL,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

exec-once = hyprctl setcursor Bibata-Modern-Ice 24
exec-once = xrdb -merge ~/.Xresources
exec-once = systemctl --user start hyprpolkitagent
exec-once = qs -c noctalia-shell
exec-once = easyeffects --gapplication-service
exec-once = udiskie
exec-once = sleep 2 && /usr/lib/xdg-desktop-portal-hyprland
exec-once = sleep 4 && /usr/lib/xdg-desktop-portal --replace
exec-once = systemctl --user start hdmi-monitor.service
exec-once = hyprpm reload

# --- Input --- #
input {
    kb_layout = us,in
    kb_variant = ,kan-kagapa
    kb_model =
    kb_options = grp:win_k_toggle
    follow_mouse = 1
    mouse_refocus = false
    float_switch_override_focus = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true
    }
}

plugin {
    dynamic-cursors {
        mode = none
        shake {
            enabled = true
            mode = enlarge
            threshold = 7.0
            base = 1.0
            speed = 2.0
            influence = 0.5
            limit = 5.0
            timeout = 1400
            decay = 0.5
        }
    }
}


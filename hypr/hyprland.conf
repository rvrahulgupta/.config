# =======================================================
# --- Audio Volume Controls ---
# binde/bindl flags ensure repeat-on-hold and operation even when the screen is locked
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# --- Screen Brightness Controls ---
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-


# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# --- # --- MMB_long_click=killall --- # --- #
bindn = , mouse:274, exec, ~/.config/hypr/scripts/mmb_kill.sh
# --- # --- # --- # --- # --- # --- # --- #

bind = $mainMod, L, exec, hyprctl switchxkblayout all next
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, exec, ~/.config/hypr/scripts/close-window.sh
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, V, togglefloating,
bind = $mainMod, Space, exec, $menu
bind = $mainMod, K, exec, hyprctl switchxkblayout at-translated-set-2-keyboard next
bind = $mainMod, R, exec, hyprctl reload
bind = $mainMod, N, exec, qs -c noctalia-shell ipc call notifications toggleHistory   # Toggle the Notification Centre
bind = $mainMod, Z, exec, qs -c noctalia-shell ipc call bar toggle                    # Toggle the Bar
bind = $mainMod, M, exec, qs -c noctalia-shell ipc call sessionMenu toggle            # Toggle the Session Menu
bind = $mainMod, C, exec, qs -c noctalia-shell ipc call plugin:clipper toggle         # Toggle the Clipboard History

#Workspace
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = w[1], bordersize:0
workspace = w[2], bordersize:1

#Workspace keybindings
bind = $mainMod, 1, workspace, 1   # Switch to workspace 1.
bind = $mainMod, 2, workspace, 2   # Switch to workspace 2.
bind = $mainMod, 3, workspace, 3   # Switch to workspace 3.
bind = $mainMod, 4, workspace, 4   # Switch to workspace 4.
bind = $mainMod, 5, workspace, 5   # Switch to workspace 5.
bind = $mainMod, 6, workspace, 6   # Switch to workspace 6.
bind = $mainMod, 7, workspace, 7   # Switch to workspace 7.
bind = $mainMod, 8, workspace, 8   # Switch to workspace 8.
bind = $mainMod, 9, workspace, 9   # Switch to workspace 9.
bind = $mainMod, 0, workspace, 10  # Switch to workspace 10.

bind = CTRL, M, exec, ~/.config/hypr/scripts/monitor-rotate.sh # Rotate the screen.

# Screenshot
bind = , PRINT, exec, ~/.config/hypr/scripts/screenshot.sh rc                    # Take screenshot of region and copy to clipboard.
bind = $mainMod, PRINT, exec, ~/.config/hypr/scripts/screenshot.sh rf            # Take screenshot of region and save it to file.
bind = CTRL, PRINT, exec, ~/.config/hypr/scripts/screenshot.sh ri                # Take screenshot of region and deal with it interactively.
bind = SHIFT, PRINT, exec, ~/.config/hypr/scripts/screenshot.sh sc               # Take screenshot of screen and copy to clipboard.
bind = SHIFT+$mainMod, PRINT, exec, ~/.config/hypr/scripts/screenshot.sh sf      # Take screenshot of screen and save it to file.
bind = SHIFT+CTRL, PRINT, exec, ~/.config/hypr/scripts/screenshot.sh si          # Take screenshot of screen and deal with it interactively.
bind = Alt+$mainMod, PRINT, exec, ~/.config/hypr/scripts/screenshot.sh wc        # Take screenshot of window and copy to clipboard.
bind = Alt+$mainMod+SHIFT, PRINT, exec, ~/.config/hypr/scripts/screenshot.sh wf  # Take screenshot of window and save it to file.
bind = ALT, PRINT, exec, ~/.config/hypr/scripts/screenshot.sh p # Colour picker.


bind = $mainMod+ALT, W, exec, ~/.config/hypr/scripts/kill-workspace.sh "close" # Close all windows in the current workspace.
bind = $mainMod+CTRL+ALT, W, exec, ~/.config/hypr/scripts/kill-workspace.sh "kill" # Kill all windows in the current workspace.

# Scroll through existing workspaces with $mainMod + arrow key
# bind = $mainMod, right, workspace, e+1 # Switch to immediate next workspace.
# bind = $mainMod, left, workspace, e-1  # Switch to immediate previous workspace.

bind = $mainMod, up, exec, hyprctl dispatch workspace "$(hyprctl workspaces -j | jq '.[].id' | sort -n | tail -n 1)"   # Switch to the highest id workspace.
bind = $mainMod, down, exec, hyprctl dispatch workspace "$(hyprctl workspaces -j | jq '.[].id' | sort -n | head -n 1)" # Switch to the lowest id workspace.

bind = $mainMod+ALT, left, exec, hyprctl dispatch workspace prev  # Switch to the immediate previously used workspace.

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic # Toggle special workspace.

#Window
bind = $mainMod+CTRL, left, movefocus, l  # Move focus to the window in left direction.
bind = $mainMod+CTRL, right, movefocus, r # Move focus to the window in right direction.
bind = $mainMod+CTRL, up, movefocus, u    # Move focus to the window in up direction.
bind = $mainMod+CTRL, down, movefocus, d  # Move focus to the window in down direction.

# Move active window to a workspace with $mainMod + SHIFT + [0-9]
bind = $mainMod+SHIFT, 1, movetoworkspace, 1  # Move the current window to workspace 1.
bind = $mainMod+SHIFT, 2, movetoworkspace, 2  # Move the current window to workspace 2.
bind = $mainMod+SHIFT, 3, movetoworkspace, 3  # Move the current window to workspace 3.
bind = $mainMod+SHIFT, 4, movetoworkspace, 4  # Move the current window to workspace 4.
bind = $mainMod+SHIFT, 5, movetoworkspace, 5  # Move the current window to workspace 5.
bind = $mainMod+SHIFT, 6, movetoworkspace, 6  # Move the current window to workspace 6.
bind = $mainMod+SHIFT, 7, movetoworkspace, 7  # Move the current window to workspace 7.
bind = $mainMod+SHIFT, 8, movetoworkspace, 8  # Move the current window to workspace 8.
bind = $mainMod+SHIFT, 9, movetoworkspace, 9  # Move the current window to workspace 9.
bind = $mainMod+SHIFT, 0, movetoworkspace, 10 # Move the current window to workspace 10.

bind = $mainMod+SHIFT, left, movetoworkspace, e-1  # Move the current window to left workspace (circular linked list).
bind = $mainMod+SHIFT, right, movetoworkspace, e+1 # Move the current window to right workspace (circular linked list).

bind = $mainMod+SHIFT, W, movetoworkspace, empty         # Move the current window to entirely new workspace (smallest vacant id).
bind = $mainMod+SHIFT, S, movetoworkspace, special:magic # Move the current window to special workspace.

bind = $mainMod, F, fullscreen, 2       # Toggle fullscreen of the current window edge to edge.
bind = $mainMod+SHIFT, F, fullscreen, 1 # Toggle maximise of the current window.

# Move/resize windows with mainMod + LMB/RMB and dragging
$lmb = mouse:272
$rmb = mouse:273
bindm = $mainMod, $lmb, movewindow   # Move the current window.
bindm = $mainMod, $rmb, resizewindow # Resize the current window.

bind = $mainMod, P, pseudo, # Toggle pseudo tiling.
bind = $mainMod, H, layoutmsg, togglesplit # Toggle horizontal split.

bind = $mainMod, J, exec, ~/.config/hypr/scripts/jump-to-window.sh # Jump to a specific window.

### Windows style shortcuts for minimizing, maximizing and closing the windows. ###

bind = ALT, space, submap, winmenu

submap = winmenu
bind = , r, exec, ~/.config/hypr/scripts/winmenu.sh restore
bind = , r, submap, reset

bind = , m, exec, ~/.config/hypr/scripts/winmenu.sh move
bind = , m, submap, reset

bind = , s, exec, ~/.config/hypr/scripts/winmenu.sh resize
bind = , s, submap, reset

bind = , n, exec, ~/.config/hypr/scripts/winmenu.sh minimize
bind = , n, submap, reset

bind = , x, exec, ~/.config/hypr/scripts/winmenu.sh maximize
bind = , x, submap, reset

bind = , c, exec, ~/.config/hypr/scripts/winmenu.sh close
bind = , c, submap, reset

bind = , escape, submap, reset
bind = ALT, space, submap, reset
submap = reset

# --- Always-available: bring back a minimized window (can't be reached via the menu since it has no active window) ---
bind = SUPER, tab, exec, hyprctl dispatch togglespecialworkspace minimized

# --- Super+Left/Right half-split snapping ---
bind = SUPER, left, exec, ~/.config/hypr/scripts/winmenu.sh snap-left
bind = SUPER, right, exec, ~/.config/hypr/scripts/winmenu.sh snap-right
